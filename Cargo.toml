[workspace]
resolver = "2"
members = ["crates/wwt", "crates/wwt-cli", "crates/wwt-testkit", "crates/wwt-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glavin001/WebWindows"

[workspace.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "instr_info", "intel", "op_code_info", "block_encoder"] }
wasm-encoder = "0.261"
wasmparser = "0.261"
wasmprinter = "0.261"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
