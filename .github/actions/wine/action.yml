name: Wine
description: >
  Wine's i386 PE DLLs, programs and conformance tests (tools/wine/build.sh),
  restored from the cache and brought up to date. Sets WINE_SRC and
  WINE_BUILD for the steps after it.

inputs:
  save:
    description: Save the build tree to the cache when its key missed.
    default: 'false'

outputs:
  key:
    description: The build tree's cache key (its inputs' hash).
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Install Wine's build tools and MinGW
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib gcc-mingw-w64-i686 binutils-mingw-w64-i686 flex bison libfreetype-dev
    # Next to the checkout (cache paths cannot contain '..'), at the same
    # absolute path in every job: Wine's Makefiles record it.
    - name: Locate the build tree
      id: key
      shell: bash
      run: |
        echo "WINE_SRC=${{ runner.workspace }}/wine-src/wine-11.0" >> "$GITHUB_ENV"
        echo "WINE_BUILD=${{ runner.workspace }}/wine-build" >> "$GITHUB_ENV"
        echo "key=wine-${{ hashFiles('.github/actions/wine/action.yml', 'tools/wine/**', 'native/audio/**', 'native/wined3d-wgpu/**', 'crates/d3dgpu-proto/include/**') }}" >> "$GITHUB_OUTPUT"
    # An older tree is fine: tools/wine/build.sh is incremental (it swaps a
    # changed wined3d patch and copies only changed sources).
    - uses: actions/cache/restore@v4
      id: restore
      with:
        path: |
          ${{ runner.workspace }}/wine-src
          ${{ runner.workspace }}/wine-build
        key: ${{ steps.key.outputs.key }}
        restore-keys: wine-
    - name: Build Wine's i386 PE DLLs, programs and conformance tests
      shell: bash
      run: |
        sh tools/wine/build.sh ntdll kernelbase kernel32 msvcrt ucrtbase advapi32 sechost \
          user32 gdi32 win32u imm32 combase comctl32 comctl32_v6 coml2 cryptbase ole32 oleaut32 \
          rpcrt4 uxtheme comdlg32 shcore shell32 shlwapi programs/winemine programs/notepad fonts \
          hid version winmm msacm32 dsound mmdevapi winepulse.drv ddraw wined3d d3d9 dinput dinput8 setupapi \
          kernel32/tests user32/tests gdi32/tests > "$RUNNER_TEMP/wine-build.log" 2>&1 \
          || { tail -n 200 "$RUNNER_TEMP/wine-build.log"; exit 1; }
        tail -n 5 "$RUNNER_TEMP/wine-build.log"
    - uses: actions/cache/save@v4
      if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      with:
        path: |
          ${{ runner.workspace }}/wine-src
          ${{ runner.workspace }}/wine-build
        key: ${{ steps.key.outputs.key }}
