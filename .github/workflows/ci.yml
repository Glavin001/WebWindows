name: CI

# Pull requests, and main once they merge (not every branch push).
on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the tests of its run that is still
# going (each test job's concurrency group), but not the build and the
# deployment: the preview of the commit before still goes up.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A cache download that stalls gives up after two minutes, not ten.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  # Pinned so Wine's Unix side (built with it) can be cached.
  EMSDK_VERSION: 6.0.11

# The jobs, and what waits for what:
#
#   changes ─┬─ linux ──────────────────────────┬─ windows ─┐
#            ├─ torture (4 shards) ─────────────│───────────┤
#            ├─ emscripten ─────────────────────│───────────┼─ CI passed
#            ├─ wine-build ───┬─ wine (5 shards)┘           │
#            │                ├─ wine64 (5 shards) ─────────┤
#            └─ wine64-build ─┴─ deploy (Preview/Production)┘
#
# The 64-bit (x86-64) side has its own Wine build (x86_64 DLLs, Wine's Unix
# side for wasm64 and a lowered one for a 32-bit memory) and its own shards.
#
# A change to nothing but documentation (Markdown, docs/) skips everything
# except the last job, which passes; protect main with that one check.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A file is code when it matches all of these.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  # Everything that runs on x86 Linux, which is also the source of truth for
  # instruction behavior: the oracle re-records every case on this CPU.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: ${{ github.workflow }}-linux-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # The x86-64 programs, Csmith and browser checks run here too.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install toolchains
        run: tools/ci/apt-install.sh gcc-multilib gcc-mingw-w64-i686 binutils-mingw-w64-i686 gcc-mingw-w64-x86-64 csmith binaryen mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: |
          cargo build --workspace
          cargo build -p wwt-wasm --target wasm32-unknown-unknown --profile release-wasm
          cargo build -p d3dgpu-core --target wasm32-unknown-unknown
      - name: Wine's Direct3D 8/9/10/11 test shaders (corpora for the shader translators)
        run: |
          tools/dxbc/fetch-wine-shaders.sh
          tools/dxbc/fetch-wine-d3d9-shaders.sh
      - name: Unit, instruction (layer 1) and snapshot (layer 5) tests; d3dgpu scenes on lavapipe
        env:
          D3DGPU_REQUIRE_GPU: 1
        run: cargo test --workspace
      - name: Committed fixtures match this CPU
        run: cargo run -p wwt-testkit --bin record -- --check
      - name: Programs (layer 2)
        run: node tests/programs/check.mjs --jobs 4
      - name: Programs with faithful memory checks (layer 2; the default is bounds traps)
        run: node tests/programs/check.mjs --no-mem-traps --opt O0,O2 --jobs 4
      - name: Csmith (layer 2)
        run: node tests/programs/check.mjs --csmith 40 --seed ${{ github.run_number }}000 --opt O0,O2 --jobs 4
      - name: Programs, x86-64 on 64-bit memory (layer 2)
        run: node tests/programs/check.mjs --arch x64 --jobs 4
      - name: Programs on the other memory width (layer 2)
        run: |
          node tests/programs/check.mjs --arch x64 --mem32 --jobs 4
          node tests/programs/check.mjs --mem64 --opt O2 --jobs 4
      - name: Csmith, x86-64 (layer 2)
        run: node tests/programs/check.mjs --arch x64 --csmith 40 --seed ${{ github.run_number }}000 --opt O0,O2 --jobs 4
      - name: Instruction coverage of MinGW output
        run: cargo run -p wwt-testkit --bin coverage -- target/programs/*.exe
      - name: Memory spike
        run: node spikes/memory/run.mjs
      - name: Browser (headless Chromium)
        run: |
          npx --yes playwright@1 install --with-deps chromium
          npm install --no-save playwright@1
          node tests/web/browser.mjs
          node tests/web/browser.mjs tests/fixtures/binaries/jumps-O2.exe "longjmp returned 50 at depth 25"
          node tests/web/browser.mjs target/programs-x64/jumps-O2.exe "longjmp returned 50 at depth 25"
          node tests/web/nomemory64.mjs
          node tests/web/traps.mjs
      - name: d3dgpu scenes in the browser (headless Chromium WebGPU)
        run: |
          runtime/d3dgpu/build.sh
          node tests/web/d3dgpu.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programs
          path: |
            target/programs/*.exe
            target/programs/results*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programs-x64
          path: |
            target/programs-x64/*.exe
            target/programs-x64/results*.json

  # GCC's execution torture tests (layer 2) on the JavaScript Win32 shims,
  # split in two, for each architecture.
  torture:
    name: torture (${{ matrix.arch }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: ${{ github.workflow }}-torture-${{ matrix.arch }}-${{ matrix.shard }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The linux job's cache: it builds the same translators.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false
      - name: Install toolchains
        run: tools/ci/apt-install.sh gcc-multilib gcc-mingw-w64-i686 binutils-mingw-w64-i686 gcc-mingw-w64-x86-64
      # The translator, and the one compiled to WebAssembly that translates
      # what was not translated ahead of time (run.mjs).
      - name: Build
        run: |
          cargo build -p wwt-cli
          cargo build -p wwt-wasm --target wasm32-unknown-unknown --profile release-wasm
      - name: GCC torture (layer 2)
        run: |
          sh tools/torture/fetch.sh
          node tests/programs/check.mjs --arch ${{ matrix.arch }} --torture target/gcc-src/gcc/testsuite/gcc.c-torture/execute --opt O0,O2 --jobs 4 --shard ${{ matrix.shard }}

  # Milestone 2 on: Wine's own DLLs, translated (not ported). Builds Wine,
  # its Unix side, the translator and the site once; the shards below and
  # the deployment take them from here.
  wine-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.head.outputs.current != 'false' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keyed as the wine job that built these before was.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Started first, to build while Wine is restored and brought up to
      # date; the bundle step waits for it.
      - name: Build the translator and the d3dgpu module (in the background)
        run: |
          { cargo build --release -p wwt-cli \
            && cargo build -p wwt-wasm -p wwt-heap -p wwt-strings --target wasm32-unknown-unknown --profile release-wasm \
            && runtime/d3dgpu/build.sh; echo $? > "$RUNNER_TEMP/rust.tmp"; mv "$RUNNER_TEMP/rust.tmp" "$RUNNER_TEMP/rust.status"; } > "$RUNNER_TEMP/rust.log" 2>&1 &
      - uses: ./.github/actions/wine
        id: wine
        with:
          save: 'true'
      # Wine's Unix side (wineserver, ntdll's and win32u's Unix parts) depends
      # on its sources, Wine's configuration (tools/wine/build.sh) and
      # Emscripten; not on the PE DLLs or wined3d's backend, which change
      # far more often.
      - uses: actions/cache/restore@v4
        id: wine-unix
        with:
          path: |
            target/wine-unix/wine_unix.mjs
            target/wine-unix/wine_unix.wasm
            target/wine-unix/wine_unix.json
            target/wine-unix/win32u_syscalls.json
            target/wine-unix/nt_calls.json
          key: wine-unix-${{ env.EMSDK_VERSION }}-${{ hashFiles('native/wine-unix/**', 'tools/wine/build.sh') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.wine-unix.outputs.cache-hit != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Wine's Unix side (Emscripten)
        if: steps.wine-unix.outputs.cache-hit != 'true'
        run: sh native/wine-unix/build.sh
      - uses: actions/cache/save@v4
        if: steps.wine-unix.outputs.cache-hit != 'true'
        with:
          path: |
            target/wine-unix/wine_unix.mjs
            target/wine-unix/wine_unix.wasm
            target/wine-unix/wine_unix.json
            target/wine-unix/win32u_syscalls.json
            target/wine-unix/nt_calls.json
          key: ${{ steps.wine-unix.outputs.cache-primary-key }}
      - name: Wait for the translator and the d3dgpu module
        run: |
          while [ ! -f "$RUNNER_TEMP/rust.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/rust.log"
          exit "$(cat "$RUNNER_TEMP/rust.status")"
      - name: The Wine bundle
        run: node runtime/node/wine-bundle.mjs
      # One archive: it keeps the translator executable, and it is quicker
      # to move than the bundle's files one by one.
      - name: Pack the build
        run: |
          tar -cf - target/release/wwt target/wasm32-unknown-unknown/release-wasm/wwt_wasm.wasm \
            target/wasm32-unknown-unknown/release-wasm/wwt_heap.wasm target/wasm32-unknown-unknown/release-wasm/wwt_strings.wasm \
            target/wine-unix/wine_unix.mjs target/wine-unix/wine_unix.wasm target/wine-unix/wine_unix.json \
            target/wine-unix/win32u_syscalls.json target/wine-unix/nt_calls.json target/wine-bundle runtime/d3dgpu/pkg \
            | zstd -T0 -3 -o wine-build.tar.zst
          ls -la wine-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: wine-build
          path: wine-build.tar.zst
          compression-level: 0
          retention-days: 7
      - name: Is this commit still the pull request's head?
        id: head
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.setOutput('current', String(data.head.sha === context.payload.pull_request.head.sha));

  # The same for 64-bit programs: Wine's x86_64 DLLs, its Unix side for
  # wasm64 (memory64) and the lowered one for a 32-bit memory (browsers
  # without memory64), and their bundles.
  wine64-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Two Unix sides to build when their cache misses.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wine
          save-if: false
      - name: Build the translator (in the background)
        run: |
          { cargo build --release -p wwt-cli; echo $? > "$RUNNER_TEMP/rust.tmp"; mv "$RUNNER_TEMP/rust.tmp" "$RUNNER_TEMP/rust.status"; } > "$RUNNER_TEMP/rust.log" 2>&1 &
      - uses: ./.github/actions/wine
        id: wine
        with:
          arch: x86_64
          save: 'true'
      - uses: actions/cache/restore@v4
        id: wine-unix
        with:
          path: |
            target/wine-unix64/wine_unix.*
            target/wine-unix64/win32u_syscalls.json
            target/wine-unix64/nt_calls.json
            target/wine-unix64-m32/wine_unix.*
            target/wine-unix64-m32/win32u_syscalls.json
            target/wine-unix64-m32/nt_calls.json
          key: wine-unix64-${{ env.EMSDK_VERSION }}-${{ hashFiles('native/wine-unix/**', 'tools/wine/build.sh') }}
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.wine-unix.outputs.cache-hit != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Wine's Unix side for wasm64, and lowered for a 32-bit memory (Emscripten)
        if: steps.wine-unix.outputs.cache-hit != 'true'
        run: |
          ARCH=x86_64 WINE_BUILD=$WINE_BUILD64 sh native/wine-unix/build.sh
          ARCH=x86_64 MEM32=1 WINE_BUILD=$WINE_BUILD64 sh native/wine-unix/build.sh
      - uses: actions/cache/save@v4
        if: steps.wine-unix.outputs.cache-hit != 'true'
        with:
          path: |
            target/wine-unix64/wine_unix.*
            target/wine-unix64/win32u_syscalls.json
            target/wine-unix64/nt_calls.json
            target/wine-unix64-m32/wine_unix.*
            target/wine-unix64-m32/win32u_syscalls.json
            target/wine-unix64-m32/nt_calls.json
          key: ${{ steps.wine-unix.outputs.cache-primary-key }}
      - name: Wait for the translator
        run: |
          while [ ! -f "$RUNNER_TEMP/rust.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/rust.log"
          exit "$(cat "$RUNNER_TEMP/rust.status")"
      - name: The x86_64 Wine bundles
        run: |
          node runtime/node/wine-bundle.mjs --arch x64
          node runtime/node/wine-bundle.mjs --arch x64 --mem32
      - name: Pack the build
        run: |
          tar -cf - target/wine-unix64/wine_unix.* target/wine-unix64/win32u_syscalls.json target/wine-unix64/nt_calls.json \
            target/wine-unix64-m32/wine_unix.* target/wine-unix64-m32/win32u_syscalls.json target/wine-unix64-m32/nt_calls.json \
            target/wine-bundle64 target/wine-bundle64-m32 \
            | zstd -T0 -3 -o wine64-build.tar.zst
          ls -la wine64-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: wine64-build
          path: wine64-build.tar.zst
          compression-level: 0
          retention-days: 7

  # The static site (page, runtime, translator, Wine bundles), deployed to
  # Vercel as a prebuilt output (Vercel builds nothing): the Preview
  # environment for pull requests, Production for main. Each shows on the
  # pull request (or the commit) with a link to the deployment. Not for
  # forks, which get no secrets.
  # The 64-bit bundles go up when their build worked; the site does without
  # them otherwise.
  deploy:
    needs: [wine-build, wine64-build]
    if: >-
      !cancelled() && needs.wine-build.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # One at a time per pull request (and for production); a running one
    # finishes, a waiting one gives way to a newer commit's.
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wine-build
      - name: Unpack the build
        run: zstd -dc wine-build.tar.zst | tar -xf -
      - uses: actions/download-artifact@v4
        if: needs.wine64-build.result == 'success'
        with:
          name: wine64-build
      - name: Unpack the 64-bit build
        if: needs.wine64-build.result == 'success'
        run: zstd -dc wine64-build.tar.zst | tar -xf -
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-vercel-62
      # The page's benchmark programs (SQLite, Lua, CoreMark, apibench),
      # built from their pinned sources for the site, not committed.
      - uses: actions/cache@v4
        with:
          path: |
            target/bench-src
            target/coremark-src
          key: bench-src-${{ hashFiles('tools/bench/sources.mjs') }}
      - name: Benchmark programs from source (tools/site/apps.mjs)
        run: |
          tools/ci/apt-install.sh gcc-mingw-w64-i686 binutils-mingw-w64-i686
          node tools/site/apps.mjs
      - name: Deploy the site to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_9BEP6m6pAw2dpH7RJPuYYHK8
          VERCEL_PROJECT_ID: prj_4EvacVdNNW0IJFbS2MH3tuqOglvq
          TARGET: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          sh tools/site/deploy.sh "$TARGET" | tee vercel.log
          url=$(tail -n 1 vercel.log)/runtime/web/
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Site ($TARGET) of ${GITHUB_SHA::7}: $url" >> "$GITHUB_STEP_SUMMARY"

  # The Wine tests, in parallel shards on the build above.
  wine:
    name: wine (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: wine-build
    # A shard of an older commit starting after the newer commit's would
    # cancel it: a run that a newer push overtook leaves the Wine tests to
    # that push's run.
    if: needs.wine-build.outputs.current == 'true'
    concurrency:
      group: ${{ github.workflow }}-wine-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: programs
          - suite: kernel32, gdi32
          - suite: user32
          - suite: torture
            shard: 1/2
          - suite: torture
            shard: 2/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/wine
      - uses: actions/download-artifact@v4
        with:
          name: wine-build
      - name: Unpack the build
        run: zstd -dc wine-build.tar.zst | tar -xf -

      - name: Programs on translated Wine
        if: matrix.suite == 'programs'
        run: node tests/programs/check.mjs --wine --jobs 4
      - name: Windows test programs on translated Wine (exceptions, threads, sound, DirectDraw)
        if: matrix.suite == 'programs'
        run: node tests/wine/win32.mjs --jobs 4
      - name: Exceptions with faithful memory checks (the default is bounds traps)
        if: matrix.suite == 'programs'
        run: WWT_MEM_TRAPS=0 node tests/wine/win32.mjs --jobs 4 seh unhandled
      - uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'programs'
        with:
          name: win32-programs
          path: |
            target/win32/*.exe
            target/win32/results-win32.json
      - name: GUI programs on translated Wine (browser display driver, headless)
        if: matrix.suite == 'programs'
        run: node tests/wine/gui.mjs
      - name: Browser on translated Wine (headless Chromium)
        if: matrix.suite == 'programs'
        run: |
          npx --yes playwright@1 install --with-deps chromium
          npm install --no-save playwright@1
          node tests/web/browser.mjs tests/programs/hello.exe "Hello from translated x86!" --wine
          node tests/web/picker.mjs
          node tests/web/gui.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'programs'
        with:
          name: gui-screens
          path: target/gui/*.png

      - name: Wine's kernel32 tests (layer 3), against the recorded baseline
        if: matrix.suite == 'kernel32, gdi32'
        run: |
          node tests/wine/winetest.mjs --jobs 4 --timeout 60 --baseline tests/wine/baseline/kernel32_test.json \
            "$WINE_BUILD/dlls/kernel32/tests/i386-windows/kernel32_test.exe"
      - name: Wine's gdi32 tests, against the recorded baseline
        if: matrix.suite == 'kernel32, gdi32'
        run: |
          node tests/wine/winetest.mjs --jobs 4 --timeout 120 --baseline tests/wine/baseline/gdi32_test.json \
            "$WINE_BUILD/dlls/gdi32/tests/i386-windows/gdi32_test.exe"
      - name: Wine's user32 tests, against the recorded baseline
        if: matrix.suite == 'user32'
        run: |
          node tests/wine/winetest.mjs --jobs 4 --timeout 120 --baseline tests/wine/baseline/user32_test.json \
            "$WINE_BUILD/dlls/user32/tests/i386-windows/user32_test.exe"

      - name: GCC torture on translated Wine
        if: matrix.suite == 'torture'
        run: |
          sh tools/torture/fetch.sh
          node tests/programs/check.mjs --wine --torture target/gcc-src/gcc/testsuite/gcc.c-torture/execute --opt O2 --jobs 4 --shard ${{ matrix.shard }}

  # The 64-bit Wine tests, in parallel shards on both builds above. Wine's
  # wasm64 Unix side uses a 64-bit table, which needs Node 24.
  wine64:
    name: wine64 (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: [wine-build, wine64-build]
    if: needs.wine-build.outputs.current == 'true'
    concurrency:
      group: ${{ github.workflow }}-wine64-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: programs
          - suite: kernel32, gdi32
          - suite: user32
          - suite: torture
            shard: 1/2
          - suite: torture
            shard: 2/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/wine
        with:
          arch: x86_64
      - uses: actions/download-artifact@v4
        with:
          name: wine-build
      - uses: actions/download-artifact@v4
        with:
          name: wine64-build
      - name: Unpack the builds
        run: |
          zstd -dc wine-build.tar.zst | tar -xf -
          zstd -dc wine64-build.tar.zst | tar -xf -

      - name: hello64 on translated x86_64 Wine
        if: matrix.suite == 'programs'
        run: |
          node runtime/node/wine.mjs tests/programs/hello64.exe | tee target/hello64.out
          grep -q "Hello from translated x86!" target/hello64.out
      - name: 64-bit programs on translated x86_64 Wine
        if: matrix.suite == 'programs'
        run: node tests/programs/check.mjs --arch x64 --wine --jobs 4
      - name: 64-bit GUI programs on translated x86_64 Wine (headless)
        if: matrix.suite == 'programs'
        run: node tests/wine/gui.mjs --arch x64
      - name: 64-bit programs and GUI on a 32-bit memory (lowered Unix side), as without memory64
        if: matrix.suite == 'programs'
        run: |
          node tests/programs/check.mjs --arch x64 --mem32 --wine --jobs 4
          node tests/wine/gui.mjs --arch x64 --mem32
      - name: 64-bit GUI programs in headless Chromium
        if: matrix.suite == 'programs'
        run: |
          npx --yes playwright@1 install --with-deps chromium
          npm install --no-save playwright@1
          node tests/web/gui.mjs --arch x64
          node tests/web/gui.mjs --arch x64 --no-memory64
      - uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'programs'
        with:
          name: gui-screens-64
          path: target/gui/*.png

      - name: Wine's x86_64 kernel32 and gdi32 tests, against the recorded baselines
        if: matrix.suite == 'kernel32, gdi32'
        run: |
          for t in kernel32 gdi32; do
            node tests/wine/winetest.mjs --jobs 4 --timeout 120 --baseline tests/wine/baseline/${t}_test64.json \
              "$WINE_BUILD64/dlls/$t/tests/x86_64-windows/${t}_test.exe"
          done
      - name: Wine's x86_64 user32 tests, against the recorded baseline
        if: matrix.suite == 'user32'
        run: |
          node tests/wine/winetest.mjs --jobs 4 --timeout 120 --baseline tests/wine/baseline/user32_test64.json \
            "$WINE_BUILD64/dlls/user32/tests/x86_64-windows/user32_test.exe"

      - name: x86-64 GCC torture on translated x86_64 Wine
        if: matrix.suite == 'torture'
        run: |
          sh tools/torture/fetch.sh
          node tests/programs/check.mjs --arch x64 --wine --torture target/gcc-src/gcc/testsuite/gcc.c-torture/execute --opt O2 --jobs 4 --shard ${{ matrix.shard }}

  # Runs the same MinGW executables on real Windows and checks they print
  # what the translated runs printed (validating the Linux reference, and
  # the recorded output of the Windows-only test programs).
  windows:
    needs: [linux, wine]
    concurrency:
      group: ${{ github.workflow }}-windows-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: programs
      - uses: actions/download-artifact@v4
        with:
          name: programs-x64
          path: programs-x64
      - uses: actions/download-artifact@v4
        with:
          name: win32-programs
          path: win32-programs
      - name: Compare native Windows runs with translated runs
        shell: pwsh
        run: |
          node tests/programs/windows-check.mjs programs
          node tests/programs/windows-check.mjs programs-x64
          node tests/programs/windows-check.mjs win32-programs

  # Spike: Emscripten's data, heap and stacks above the guest limit.
  emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: ${{ github.workflow }}-emscripten-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: spikes/emscripten/build.sh

  # The one check to require: it passes when every job above passed or was
  # skipped (documentation-only changes, forks' deployments). A run that a
  # newer push overtook fails it: its tests were cancelled or not run.
  ci:
    name: CI passed
    if: always()
    needs: [changes, linux, torture, wine-build, wine64-build, deploy, wine, wine64, windows, emscripten]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.wine-build.outputs.current == 'false'
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
